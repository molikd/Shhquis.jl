name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches Project.toml
        shell: bash
        run: |
          project_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Project.toml)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$project_version" = "$tag_version" || {
            echo "Tag $tag_version does not match Project.toml version $project_version"
            exit 1
          }

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: dmolik/shhquis
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
