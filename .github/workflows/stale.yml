name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '33 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: -1
          stale-issue-message: 'This issue has had no recent activity. Please comment if it remains relevant.'
          stale-pr-message: 'This pull request has had no recent activity. Please comment if work is continuing.'
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
